  .pill { font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 10px; }

  .pill.away { background: #dbeafe; color: #1d4ed8; }
  .pill.neutral { background: #f3e8ff; color: #7e22ce; }

<div class="app-header">
  <h1>📍 Sports Trip Planner</h1>
  <div class="subtitle" id="headerSubtitle">Loading...</div>
  <div class="top-buttons">
    <label class="icon-btn" for="csvInput">⬆ Upload CSV</label>
    <input type="file" id="csvInput" accept=".csv" />
    <button class="icon-btn clear" onclick="clearAll()">✕ Clear Added Games</button>
  </div>
  <div class="segmented">
    <button class="active" id="listTabBtn" onclick="setView('list')">📋 Schedule</button>
    <button id="calTabBtn" onclick="setView('calendar')">🗓️ Calendar</button>
    <button id="tripsTabBtn" onclick="setView('trips')">✈️ Trips</button>
  </div>
</div>

<div class="content">
  <div id="errorBox"></div>

  <div class="filter-card" id="listFilters">
    <div class="filter-row-label">Teams</div>
    <div class="chip-scroll" id="teamButtons"></div>
    <div class="chip-actions">
      <button class="chip-action-btn" onclick="selectAllTeams()">Select All</button>
      <button class="chip-action-btn" onclick="deselectAllTeams()">Deselect All</button>
    </div>
    <div class="filter-row-label">Date Range</div>
    <div class="date-row">
      <div><input type="date" id="startDate" /></div>
      <div><input type="date" id="endDate" /></div>
    </div>
    <div class="filter-row-label">City (shows anything within 100 mi)</div>
    <input type="text" id="cityFilter" placeholder="e.g. Pittsburgh, Cleveland, London..." />
    <div class="city-hint" id="cityHint"></div>
  </div>

  <div id="listView"><div id="gameListContainer"></div></div>

  <div id="calendarView" style="display:none;">
    <button class="expand-btn" onclick="openCalModal()">⛶ Expand Calendar</button>
    <div class="cal-controls">
      <div class="filter-row-label">Max Days: <span class="slider-value" id="calDaysLabel">4</span></div>
      <input type="range" id="calDaysSlider" min="1" max="14" value="4" />
      <div class="filter-row-label">Highlight: Max Distance: <span class="slider-value" id="calMilesLabel">75</span> mi</div>
      <input type="range" id="calMilesSlider" min="0" max="500" step="5" value="75" />
    </div>
    <div class="cal-legend" id="calLegend"></div>
    <div class="cal-nav">
      <button class="cal-nav-btn" onclick="shiftMonth(-1)">‹</button>
      <div class="cal-month-label" id="calMonthLabel"></div>
      <button class="cal-nav-btn" onclick="shiftMonth(1)">›</button>
    </div>
    <div class="cal-grid" id="calGrid"></div>
    <div id="calDayPanel"></div>
  </div>

  <div id="tripsView" style="display:none;">
    <div class="trip-controls">
      <div class="filter-row-label">Max Days: <span class="slider-value" id="maxDaysLabel">4</span></div>
      <input type="range" id="maxDaysSlider" min="1" max="14" value="4" />
      <div class="filter-row-label">Max Distance Between Stops: <span class="slider-value" id="maxMilesLabel">75</span> mi</div>
      <input type="range" id="maxMilesSlider" min="0" max="500" step="5" value="75" />
    </div>
    <div id="tripList"></div>
  </div>
</div>

<div class="cal-modal-overlay" id="calModalOverlay">
  <div class="cal-modal-box">
    <button class="cal-modal-close" onclick="closeCalModal()">✕</button>
    <div class="cal-legend" id="calLegendModal"></div>
    <div class="cal-nav">
      <button class="cal-nav-btn" onclick="shiftMonth(-1)">‹</button>
      <div class="cal-month-label" id="calMonthLabelModal"></div>
      <button class="cal-nav-btn" onclick="shiftMonth(1)">›</button>
    </div>
    <div class="cal-grid-lg" id="calGridModal"></div>
    <div id="calDayPanelModal"></div>
  </div>
</div>

function distanceMiles(cityA, cityB) {
  if (!cityA || !cityB) return Infinity;
  if (cityA === cityB) return 0;
  var a = cityCoords[cityA], b = cityCoords[cityB];
  if (!a || !b) return Infinity;
  return haversineMiles(a, b);
}
function haversineMiles(a, b) {
  var R = 3958.8;
  var dLat = (b[0] - a[0]) * Math.PI / 180;
  var dLon = (b[1] - a[1]) * Math.PI / 180;
  var lat1 = a[0] * Math.PI / 180, lat2 = b[0] * Math.PI / 180;
  var h = Math.sin(dLat / 2) * Math.sin(dLat / 2) + Math.cos(lat1) * Math.cos(lat2) * Math.sin(dLon / 2) * Math.sin(dLon / 2);
  var c = 2 * Math.atan2(Math.sqrt(h), Math.sqrt(1 - h));
  return R * c;
}
function citiesAreNearby(a, b, miles) { return distanceMiles(a, b) <= miles; }

// "Home" = ZIP 08060 (South Jersey / Philly metro area)
var homeCoords = [39.9709, -74.6801];
function isNearHome(city, miles) {
  var c = cityCoords[city];
  if (!c) return false;
  return haversineMiles(homeCoords, c) <= miles;
}

function findCityMatch(query) {
  var q = query.trim().toLowerCase();
  if (!q) return null;
  var keys = Object.keys(cityCoords);
  var exact = keys.find(function(k) { return k.split(',')[0].trim().toLowerCase() === q; });
  if (exact) return exact;
  var starts = keys.find(function(k) { return k.split(',')[0].trim().toLowerCase().indexOf(q) === 0; });
  if (starts) return starts;
  var contains = keys.find(function(k) { return k.toLowerCase().indexOf(q) !== -1; });
  if (contains) return contains;
  return null;
}

function getTodayStr() {

  var day = String(d.getDate()).length < 2 ? '0' + d.getDate() : String(d.getDate());

function parseCSV(text) {
  var lines = text.split(/\r?\n/).filter(function(l) { return l.trim().length > 0; });
  if (lines.length === 0) return [];
  var headers = lines[0].split(',').map(function(h) { return h.trim(); });
  return lines.slice(1).map(function(line) {
    var values = line.split(',').map(function(v) { return v.trim(); });
    var row = {};
    headers.forEach(function(h, i) { row[h] = values[i] || ''; });
    return row;
  });
}

document.getElementById('csvInput').addEventListener('change', function(e) {
  var file = e.target.files[0];
  if (!file) return;
  var errorBox = document.getElementById('errorBox');
  errorBox.style.display = 'none';
  if (!file.name.toLowerCase().endsWith('.csv')) {

    errorBox.style.display = 'block';
    return;
  }
  var reader = new FileReader();
  reader.onload = function(evt) {
    try {
      var rows = parseCSV(evt.target.result);
      var formatted = rows.map(function(row) {
        return {
          date: row.Date || row.date, time: row.Time || row.time || 'TBD',
          team: row.Team || row.team, opponent: row.Opponent || row.opponent,
          homeAway: row['Home/Away'] || row.homeAway || row.HomeAway,
          venue: row.Venue || row.venue, city: row.City || row.city, sport: row.Sport || row.sport
        };
      }).filter(function(g) { return g.date && g.team; });

      formatted.forEach(function(g) {
        if (!knownTeams.has(g.team)) {
          knownTeams.add(g.team);
          if (g.team !== 'Pitt Volleyball') deselectedTeams.add(g.team);
        }
      });

      uploadedGames = uploadedGames.concat(formatted);
      scheduleData = builtInGames.concat(uploadedGames);

      errorBox.textContent = 'Error reading file. Make sure columns are: Date, Time, Team, Opponent, Home/Away, Venue, City, Sport';
      errorBox.style.display = 'block';
    }
  };
  reader.readAsText(file);
});

function collapseIntoSeries(games) {
  var byTeam = {};
  games.forEach(function(g) { if (!byTeam[g.team]) byTeam[g.team] = []; byTeam[g.team].push(g); });
  var series = [];
  Object.keys(byTeam).forEach(function(team) {
    var teamGames = byTeam[team].slice().sort(function(a, b) { return (a.date || '').localeCompare(b.date || ''); });
    var block = null;
    teamGames.forEach(function(g) {
      if (!g.date) return;
      if (block && block.city === g.city) {
        var gap = (new Date(g.date) - new Date(block.endDate)) / (1000 * 60 * 60 * 24);
        if (gap <= 1) { block.endDate = g.date; block.opponents.add(g.opponent); block.games.push(g); return; }
      }
      if (block) series.push(block);
      block = { team: g.team, city: g.city, venue: g.venue, sport: g.sport, startDate: g.date, endDate: g.date, opponents: new Set([g.opponent]), games: [g] };
    });
    if (block) series.push(block);
  });
  return series;
}

function daysBetweenSeries(s1, s2) {
  var d1start = new Date(s1.startDate), d1end = new Date(s1.endDate);
  var d2start = new Date(s2.startDate), d2end = new Date(s2.endDate);
  if (d2start <= d1end && d1start <= d2end) return 0;
  if (d2start > d1end) return (d2start - d1end) / (1000 * 60 * 60 * 24);
  return (d1start - d2end) / (1000 * 60 * 60 * 24);
}

// Finds games near (but outside) the cluster's date window - within 2 days before/after -
// that are also within the mile radius, so they can be noted without inflating the cluster.
function findNearMisses(allSeries, s1, s2, maxMi) {
  var minStart = new Date(Math.min(new Date(s1.startDate), new Date(s2.startDate)));
  var maxEnd = new Date(Math.max(new Date(s1.endDate), new Date(s2.endDate)));
  var extStart = new Date(minStart); extStart.setDate(extStart.getDate() - 2);
  var extEnd = new Date(maxEnd); extEnd.setDate(extEnd.getDate() + 2);
  var notes = [];
  allSeries.forEach(function(s) {
    if (s === s1 || s === s2) return;
    if (s.team === s1.team || s.team === s2.team) return;
    var sStart = new Date(s.startDate), sEnd = new Date(s.endDate);
    var withinExtended = sEnd >= extStart && sStart <= extEnd;
    var withinActual = sEnd >= minStart && sStart <= maxEnd;
    if (withinExtended && !withinActual) {
      if (citiesAreNearby(s.city, s1.city, maxMi) || citiesAreNearby(s.city, s2.city, maxMi)) {
        notes.push(s);
      }
    }
  });
  return notes;
}

function buildTrips(seriesList, maxDays, maxMi) {
  var sorted = seriesList.slice().sort(function(a, b) { return a.startDate.localeCompare(b.startDate); });
  var trips = [];
  for (var i = 0; i < sorted.length; i++) {
    for (var j = i + 1; j < sorted.length; j++) {
      var s1 = sorted[i], s2 = sorted[j];
      if (s1.team === s2.team) continue;

      var d1s = new Date(s1.startDate), d1e = new Date(s1.endDate);
      var d2s = new Date(s2.startDate), d2e = new Date(s2.endDate);
      var minStart = d1s < d2s ? d1s : d2s;
      var maxEnd = d1e > d2e ? d1e : d2e;
      var clusterSpanDays = Math.round((maxEnd - minStart) / (1000 * 60 * 60 * 24)) + 1;
      if (clusterSpanDays > maxDays) continue;

      if (citiesAreNearby(s1.city, s2.city, maxMi)) {
        var pair = [s1, s2];
        pair.notes = findNearMisses(sorted, s1, s2, maxMi);
        trips.push(pair);
      }
    }
  }
  return trips;
}

function getHighlightedDateMap(games) {
  var series = collapseIntoSeries(games);

      if (!map[ds]) map[ds] = [];
      map[ds].push(pair);
      cur.setDate(cur.getDate() + 1);

  });

}

  var games = getFilteredGames();
  var teams = Array.from(new Set(scheduleData.map(function(g) { return g.team; }))).sort();

  var legendHtml = teams.map(function(t) {
    return '<div class="cal-legend-item"><span class="cal-legend-dot" style="background:' + getTeamColor(t) + '"></span>' + t + '</div>';

  var byDate = {};
  games.forEach(function(g) { if (!g.date) return; if (!byDate[g.date]) byDate[g.date] = []; byDate[g.date].push(g); });

  var highlightedMap = getHighlightedDateMap(games);
  var todayStr = getTodayStr();
  var cal = buildCalendarDays();

  var dowHtml = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(function(d) { return '<div class="cal-dow">' + d + '</div>'; }).join('');
  var smallCells = '';
  for (var i = 0; i < cal.startWeekday; i++) smallCells += '<div class="cal-cell empty"></div>';
  for (var day = 1; day <= cal.daysInMonth; day++) {
    var dateStr = cal.y + '-' + pad2(cal.m + 1) + '-' + pad2(day);
    var dayGames = byDate[dateStr] || [];
    var isHighlighted = !!highlightedMap[dateStr];
    var isNearHomeDay = dayGames.some(function(g) { return isNearHome(g.city, maxMiles); });
    var classes = 'cal-cell';
    if (isHighlighted) classes += ' overlap';
    if (isNearHomeDay) classes += ' near-home';
    if (dateStr === todayStr) classes += ' today';
    if (dateStr === selectedCalDate) classes += ' selected';
    var dotsHtml = dayGames.slice(0, 6).map(function(g) {
      return '<span class="cal-dot" style="background:' + getTeamColor(g.team) + '" title="' + g.team + '">' + getTeamLetter(g.team) + '</span>';
    }).join('');
    var moreHtml = dayGames.length > 6 ? '<span class="cal-more">+' + (dayGames.length - 6) + '</span>' : '';
    var flagHtml = (isHighlighted ? '<span class="cal-overlap-flag">🔥</span>' : '') + (isNearHomeDay ? '<span class="cal-overlap-flag" style="right:16px;">🏠</span>' : '');
    smallCells += '<div class="' + classes + '" onclick="selectCalDate(\'' + dateStr + '\')">' +
      flagHtml + '<div class="cal-daynum">' + day + '</div>' + '<div class="cal-dot-row">' + dotsHtml + moreHtml + '</div>' + '</div>';
  }
  document.getElementById('calGrid').innerHTML = dowHtml + smallCells;

  var dowHtmlLg = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(function(d) { return '<div class="cal-dow-lg">' + d + '</div>'; }).join('');
  var largeCells = '';
  for (var j = 0; j < cal.startWeekday; j++) largeCells += '<div class="cal-cell-lg empty"></div>';
  for (var day2 = 1; day2 <= cal.daysInMonth; day2++) {
    var dateStr2 = cal.y + '-' + pad2(cal.m + 1) + '-' + pad2(day2);
    var dayGames2 = byDate[dateStr2] || [];
    var isHighlighted2 = !!highlightedMap[dateStr2];
    var isNearHomeDay2 = dayGames2.some(function(g) { return isNearHome(g.city, maxMiles); });
    var classes2 = 'cal-cell-lg';
    if (isHighlighted2) classes2 += ' overlap';
    if (isNearHomeDay2) classes2 += ' near-home';
    if (dateStr2 === todayStr) classes2 += ' today';
    if (dateStr2 === selectedCalDate) classes2 += ' selected';
    var barsHtml = dayGames2.slice(0, 5).map(function(g) {
      return '<div class="cal-bar" style="background:' + getTeamColor(g.team) + '" title="' + g.team + '">' + g.team + '</div>';
    }).join('');
    var moreHtml2 = dayGames2.length > 5 ? '<div class="cal-bar-more">+' + (dayGames2.length - 5) + ' more</div>' : '';
    var flagHtml2 = (isHighlighted2 ? '<span class="cal-overlap-flag">🔥</span>' : '') + (isNearHomeDay2 ? '<span class="cal-overlap-flag" style="right:16px;">🏠</span>' : '');
    largeCells += '<div class="' + classes2 + '" onclick="selectCalDate(\'' + dateStr2 + '\')">' +
      flagHtml2 + '<div class="cal-daynum-lg">' + day2 + '</div>' + barsHtml + moreHtml2 + '</div>';
  }
  document.getElementById('calGridModal').innerHTML = dowHtmlLg + largeCells;

  renderCalDayPanel(games, highlightedMap, 'calDayPanel');
  renderCalDayPanel(games, highlightedMap, 'calDayPanelModal');
}

function renderTrips() {
  var games = getFilteredGames();
  var series = collapseIntoSeries(games);
  var trips = buildTrips(series, maxDaysBetween, maxMiles);
  var tripListEl = document.getElementById('tripList');

  if (trips.length === 0) {
    tripListEl.innerHTML = '<div class="trip-card"><div class="empty">No trip opportunities found.<br>Try increasing the day or distance limit.</div></div>';
    return;
  }

  tripListEl.innerHTML = trips.map(tripCardHtml).join('');
}

function render() {
  renderTeamButtons();
  if (currentView === 'list') renderList();
  else if (currentView === 'calendar') renderCalendar();
  else renderTrips();
}

function setMaxDays(v) {
  maxDaysBetween = v;
  document.getElementById('maxDaysLabel').textContent = v;
  document.getElementById('calDaysLabel').textContent = v;
  document.getElementById('maxDaysSlider').value = v;
  document.getElementById('calDaysSlider').value = v;
  render();
}
function setMaxMiles(v) {
  maxMiles = v;
  document.getElementById('maxMilesLabel').textContent = v;
  document.getElementById('calMilesLabel').textContent = v;
  document.getElementById('maxMilesSlider').value = v;
  document.getElementById('calMilesSlider').value = v;
  render();
}

document.getElementById('startDate').addEventListener('change', render);
document.getElementById('endDate').addEventListener('change', render);
document.getElementById('cityFilter').addEventListener('input', render);
document.getElementById('maxDaysSlider').addEventListener('input', function(e) { setMaxDays(Number(e.target.value)); });
document.getElementById('calDaysSlider').addEventListener('input', function(e) { setMaxDays(Number(e.target.value)); });
document.getElementById('maxMilesSlider').addEventListener('input', function(e) { setMaxMiles(Number(e.target.value)); });
document.getElementById('calMilesSlider').addEventListener('input', function(e) { setMaxMiles(Number(e.target.value)); });

render();
</script>
</body>
</html>
